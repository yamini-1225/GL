name: Generate APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Web Wrapper Project
        run: |
          mkdir -p app/src/main/assets
          echo "Building native Android wrapper structure..."

      - name: Build notification
        run: echo "Workflow infrastructure ready."
